<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alanna Bent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="custom.css">
    <script src="custom.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a class="navbar__brand" href="index.html" aria-label="Alanna Bent home">alanna bent</a>

    </header>
    <main class="hero">
      <section class="intro" aria-labelledby="hero-title">
        <p class="intro__copy">
          Hi there 👋. I am a
          <span class="paint-highlight">UX Designer</span>

        <div class="intro__links">
          <ul class="skills" aria-label="Skills">
            <li><span class="skill-tag">web design</span></li>
            <li><span class="skill-tag">web dev</span></li>

            <li><span class="skill-tag">end-to-end</span></li>
            <li><span class="skill-tag">Figma</span></li>
            <li>
              <a class="resume-link" href="resume.html" aria-label="View resume">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </a>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <span class="brand-cursor" aria-hidden="true"></span>
    <footer class="color-bar" aria-label="Page sections">
      <span class="color-bar__segment color-bar__segment--home" aria-label="Home" data-label="Home" tabindex="0"></span>
      <span class="color-bar__segment color-bar__segment--about" aria-label="About" data-label="About" tabindex="0"></span>
      <span class="color-bar__segment color-bar__segment--projects" aria-label="Projects" data-label="Projects" tabindex="0"></span>
      <span class="color-bar__segment color-bar__segment--resume" aria-label="Resume" data-label="Resume" tabindex="0"></span>
      <span class="color-bar__segment color-bar__segment--contact" aria-label="Contact" data-label="Contact" tabindex="0"></span>
      <span class="color-bar__cursor" aria-hidden="true"></span>
    </footer>
